name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The runner has no fonts, and PDFsharp's cross-platform build cannot use the host's
      # anyway, so anything that draws text fails without this. Same reason the runtime image
      # installs them.
      - name: Install fonts for the rendering tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Restore
        run: dotnet restore

      # Zero warnings is a project rule, so CI enforces it rather than trusting review.
      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Packing in CI catches metadata and licence-file problems before a release tag does.
      - name: Pack
        run: dotnet pack MonitovoPDF/MonitovoPDF.csproj --configuration Release --no-build -o artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: artifacts/*
          if-no-files-found: error

  integration:
    name: End-to-end against a real template
    runs-on: ubuntu-latest
    # Runs on pull requests too. It builds a LibreOffice image and so is the slow half of CI, but
    # it is also the only check that proves the actual product works: a template authored by a
    # real tool, filled, and read back by decoders that are not the encoder. A check that only
    # runs after merge reports problems too late to stop them.
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fill a LibreOffice-authored template and decode the barcodes
        run: >
          docker compose -f integration/docker-compose.yml up
          --build --abort-on-container-exit --exit-code-from integration

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-output
          path: integration/out/*.pdf
          if-no-files-found: warn
